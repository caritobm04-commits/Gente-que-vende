<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gente que vende · BEES</title>
<style>
:root{
  --negro:#000; --negro2:#141414; --negro3:#1f1f1f; --linea:#2e2e2e;
  --amarillo:#FFD900; --amarillo-osc:#e6c200; --blanco:#fff; --gris:#a8a8a8;
  --rojo:#E5322D; --ambar:#FFB400; --verde:#1FB75A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--negro);color:var(--blanco);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--amarillo);color:var(--negro);margin:0 -16px 20px;padding:22px 20px 20px;
  border-bottom:6px solid var(--negro);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:6px;background:var(--amarillo)}
.marca{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px}
.hex{width:34px;height:34px;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;
  clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);font-size:18px}
h1{margin:10px 0 2px;font-size:26px;line-height:1.1;font-weight:900;text-transform:uppercase}
header p{margin:0;font-size:14px;font-weight:600;opacity:.8}
.buscador{position:sticky;top:0;z-index:5;background:var(--negro);padding:12px 0 10px}
.caja{position:relative}
.caja input{width:100%;font-size:17px;padding:15px 44px 15px 16px;border-radius:14px;
  border:2px solid var(--amarillo);background:var(--negro2);color:var(--blanco);outline:none;-webkit-appearance:none}
.caja input::placeholder{color:#7d7d7d}
.caja input:focus{box-shadow:0 0 0 3px rgba(255,217,0,.25)}
.limpiar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;
  background:var(--negro3);color:var(--amarillo);font-size:18px;display:none;cursor:pointer}
.caja.tiene .limpiar{display:block}
.ayuda{margin:8px 2px 0;font-size:13px;color:var(--gris)}
.tarjeta{background:var(--negro2);border:1px solid var(--linea);border-left:6px solid var(--amarillo);
  border-radius:16px;padding:16px;margin-top:14px}
.participante{font-size:19px;font-weight:800;line-height:1.2}
.sala{display:inline-block;margin-top:8px;background:var(--amarillo);color:var(--negro);font-weight:800;
  font-size:12px;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.6px}
.ejec{margin-top:14px;padding-top:14px;border-top:1px dashed var(--linea)}
.etq{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.ejec .nombre{font-size:17px;font-weight:700;margin-top:2px}
.tel{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:var(--amarillo);font-weight:800;
  text-decoration:none;font-size:17px;border:1px solid var(--amarillo);border-radius:10px;padding:7px 12px}
.tel:active{background:var(--amarillo);color:var(--negro)}
.metricas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.m{border-radius:12px;padding:12px 6px 10px;text-align:center;color:var(--negro)}
.m .v{font-size:23px;font-weight:900;line-height:1}
.m .t{font-size:11px;font-weight:800;margin-top:6px;line-height:1.15;text-transform:uppercase}
.m.rojo{background:var(--rojo);color:#fff}
.m.ambar{background:var(--ambar);color:#000}
.m.verde{background:var(--verde);color:#000}
.vacio{text-align:center;color:var(--gris);padding:36px 10px;font-size:15px}
.lista .item{width:100%;text-align:left;background:var(--negro2);border:1px solid var(--linea);color:var(--blanco);
  border-radius:12px;padding:12px 14px;margin-top:8px;font-size:16px;cursor:pointer;display:block}
.lista .item:active{border-color:var(--amarillo)}
.lista .item small{display:block;color:var(--gris);margin-top:2px;font-size:13px}
.lista mark{background:transparent;color:var(--amarillo);font-weight:800}
.leyenda{margin-top:24px;border:1px solid var(--linea);border-radius:14px;padding:14px;background:var(--negro2)}
.leyenda h2{margin:0 0 10px;font-size:13px;color:var(--amarillo);text-transform:uppercase;letter-spacing:.8px}
.fila{display:flex;align-items:center;gap:8px;font-size:13px;color:#ddd;margin-top:6px;flex-wrap:wrap}
.fila b{min-width:96px;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.r{background:var(--rojo)}.dot.a{background:var(--ambar)}.dot.g{background:var(--verde)}
footer{margin-top:20px;text-align:center;font-size:12px;color:#6d6d6d}
</style>
</head>

    <div class="fila"><b>NSR</b><span class="dot r"></span>menos de 90%<span class="dot a"></span>90% a 99%<span class="dot g"></span>100% o más</div>
  </div>

// ======= RANGOS DE COLOR (cámbialos aquí si hace falta) =======
// Score de ejecución: rojo < 50%, amarillo 50–69.9%, verde >= 70%
// NSR: rojo < 90%, amarillo 90–99.9%, verde >= 100%
const RANGOS = {
  score: { rojo: 0.50, verde: 0.70 },
  nsr:   { rojo: 0.90, verde: 1.00 }
};

const $ = id => document.getElementById(id);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
DATA.forEach(d => { d._p = norm(d.p); d._e = norm(d.e); });

function color(valor, tipo){
  const r = RANGOS[tipo];
  if (valor < r.rojo) return 'rojo';
  if (valor < r.verde) return 'ambar';
  return 'verde';
}
const pct = v => (v*100).toFixed(1).replace('.', ',') + '%';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resaltar(texto, q){
  const t = esc(texto);
  if(!q) return t;
  const n = norm(texto), i = n.indexOf(q);
  if(i < 0) return t;
  // la normalización conserva el largo en estos nombres
  return esc(texto.slice(0,i)) + '<mark>' + esc(texto.slice(i, i+q.length)) + '</mark>' + esc(texto.slice(i+q.length));
}

function metrica(valor, titulo, tipo){
  return `<div class="m ${color(valor,tipo)}"><div class="v">${pct(valor)}</div><div class="t">${titulo}</div></div>`;
}

function tarjeta(d){
  return `<div class="tarjeta">
    <div class="etq">Participante</div>
    <div class="participante">${esc(d.p)}</div>
    <span class="sala">Sala ${esc(d.s)}</span>
    <div class="ejec">
      <div class="etq">Ejecutivo comercial</div>
      <div class="nombre">${esc(d.e)}</div>
      <a class="tel" href="https://wa.me/591${d.c}" target="_blank" rel="noopener">&#128222; ${d.c}</a>
    </div>
    <div class="metricas">
      ${metrica(d.sep,'Score ejecución<br>Septiembre','score')}
      ${metrica(d.oct,'Score ejecución<br>Octubre','score')}
      ${metrica(d.nsr,'NSR<br>Octubre','nsr')}
    </div>
  </div>`;
}

function buscar(){
  const q = norm($('q').value);
  $('caja').classList.toggle('tiene', q.length > 0);
  const out = $('resultado');
  if(q.length < 2){
    out.innerHTML = '<div class="vacio">Escribe al menos 2 letras para buscar</div>';
    $('ayuda').textContent = 'También puedes buscar por el nombre del ejecutivo.';
    return;
  }
  const hits = DATA.filter(d => d._p.includes(q) || d._e.includes(q));
  if(!hits.length){
    out.innerHTML = '<div class="vacio">No encontramos ese nombre.<br>Revisa la ortografía o prueba solo con el apellido.</div>';
    $('ayuda').textContent = '';
    return;
  }
  $('ayuda').textContent = hits.length === 1 ? '1 resultado' : hits.length + ' resultados';
  if(hits.length === 1){ out.innerHTML = tarjeta(hits[0]); return; }
  if(hits.length <= 6 && hits.every(h => h._p.includes(q))){
    out.innerHTML = hits.map(tarjeta).join(''); return;
  }
  out.innerHTML = '<div class="lista">' + hits.slice(0,30).map((d,i) =>
    `<button class="item" data-i="${DATA.indexOf(d)}">${resaltar(d.p,q)}<small>Sala ${esc(d.s)} · Ejecutivo: ${resaltar(d.e,q)}</small></button>`
  ).join('') + '</div>';
}

$('q').addEventListener('input', buscar);
$('limpiar').addEventListener('click', () => { $('q').value=''; buscar(); $('q').focus(); });
$('resultado').addEventListener('click', e => {
  const b = e.target.closest('.item');
  if(!b) return;
  $('resultado').innerHTML = tarjeta(DATA[+b.dataset.i]);
  $('ayuda').textContent = 'Toca la lupa del teclado para otra búsqueda';
  window.scrollTo({top:0,behavior:'smooth'});
});
buscar();
</script>

</html>
